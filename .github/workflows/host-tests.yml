name: Host regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  storage-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Image packer and atomic output
        run: python3 scripts/test-build-image.py
      - name: Shared legacy storage contract
        run: python3 scripts/test-storage-layout.py
      - name: Runtime layout negotiation and mailbox ABI
        run: python3 scripts/test-storage-runtime.py
      - name: Loader storage service and firmware geometry
        run: python3 scripts/test-loader-storage-service.py
      - name: Header and partition reader with sanitizers
        run: python3 scripts/test-loader-image.py
      - name: SHA-256 known answers and binary inputs
        run: python3 scripts/test-sha256.py
      - name: Mailbox concurrency
        run: python3 scripts/test-storage-mailbox.py
      - name: Loader log buffer ownership
        run: python3 scripts/test-loader-log-buffer.py
      - name: Loader direct storage writes are disabled by default
        run: python3 scripts/test-loader-write-policy.py
      - name: Loader artifact and build record consistency
        run: python3 scripts/test-loader-build-record.py
      - name: Persistence slot selection and fallback
        run: python3 scripts/test-var-store-selection.py
      - name: Persistence unpacking on temporary files
        run: python3 scripts/test-var-store-unpack.py
      - name: Persistence archive roundtrip and interrupted saves
        run: python3 scripts/test-var-store-roundtrip.py
      - name: Autosaver obeys the restore enable flag
        run: python3 scripts/test-var-store-autosave.py
      - name: Init restore supervision and service gate
        run: python3 scripts/test-restore-guard.py
      - name: Kernel export audit semantics
        run: python3 scripts/test-kernel-export-audit.py
