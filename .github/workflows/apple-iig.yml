name: Generate XNU 8796 Apple IIG sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-iig.yml'
      - 'scripts/generate-apple-iig.py'
permissions:
  contents: read
jobs:
  generate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: apple-oss-distributions/xnu
          ref: c54f35ca767986246321eb901baf8f5ff7923f6a
          path: apple-xnu
      - name: Generate with Xcode 15 IIG and record provenance
        run: python3 scripts/generate-apple-iig.py apple-xnu apple-iig-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apple-iig-8796
          path: apple-iig-output/
          if-no-files-found: error
          retention-days: 14
